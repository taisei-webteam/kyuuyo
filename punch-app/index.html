<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>打刻</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-hover: #15803d;
      --warning: #ea580c;
      --warning-hover: #c2410c;
      --info: #0891b2;
      --info-hover: #0e7490;
      --danger: #dc2626;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #64748b;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 1024px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .header-title { font-size: 1.5rem; font-weight: 800; color: var(--text); }

    .header-clock {
      font-size: 2.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--primary);
    }

    .header-date { font-size: 0.875rem; color: var(--text-secondary); text-align: right; }

    .btn-history {
      padding: 6px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      color: var(--text-secondary); transition: all 0.15s;
    }
    .btn-history:hover { border-color: var(--primary); color: var(--primary); }

    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── Employee Grid ── */
    .employee-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; flex: 1; align-content: start;
    }

    .employee-card {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 20px 12px; background: var(--surface); border: 2px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s; user-select: none;
    }
    .employee-card:active { transform: scale(0.96); }
    .employee-card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(37,99,235,0.15); }

    .employee-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 700; color: #fff;
    }
    .employee-name { font-size: 1rem; font-weight: 600; text-align: center; }
    .employee-dept { font-size: 0.7rem; color: var(--text-secondary); }
    .employee-status { font-size: 0.675rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
    .status-out { background: #f1f5f9; color: #64748b; }
    .status-in { background: #dcfce7; color: #16a34a; }
    .status-goout { background: #fff7ed; color: #ea580c; }
    .status-done { background: #e0f2fe; color: #0369a1; }

    /* ── Punch Screen ── */
    .punch-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }

    .btn-back {
      background: none; border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 16px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; color: var(--text-secondary); transition: background 0.12s;
    }
    .btn-back:hover { background: #f1f5f9; }

    .punch-employee-name { font-size: 1.25rem; font-weight: 700; }
    .punch-employee-dept { font-size: 0.8rem; color: var(--text-secondary); }

    .punch-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      max-width: 672px; margin: 0 auto; width: 100%;
    }

    .punch-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 36px 16px; border: none; border-radius: 20px;
      font-size: 1.125rem; font-weight: 700; color: #fff; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s; user-select: none;
      max-width: 320px; width: 100%; margin: 0 auto;
    }
    .punch-btn:active { transform: scale(0.95); }
    .punch-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    /* 長押し（手動打刻）: 2秒かけて下端のバーが伸び、満了で時刻入力を開く */
    .punch-btn { position: relative; overflow: hidden; -webkit-touch-callout: none; touch-action: manipulation; }
    .punch-btn::after {
      content: ''; position: absolute; left: 0; bottom: 0; height: 6px; width: 0;
      background: rgba(255,255,255,0.85); border-radius: 0 3px 3px 0;
    }
    .punch-btn.pressing::after { animation: longpress-fill 2s linear forwards; }
    @keyframes longpress-fill { from { width: 0; } to { width: 100%; } }
    .punch-hint { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 12px; }

    /* 手動打刻モーダル */
    .manual-time-input {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center;
      outline: none; background: var(--surface); color: var(--text);
    }
    .manual-time-input:focus { border-color: var(--primary); }
    .manual-note {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #fef3c7; color: #92400e;
      font-size: 0.8rem; line-height: 1.5;
    }
    .modal-error { color: var(--danger); font-size: 0.8rem; margin-top: 8px; display: none; }
    .modal-error.show { display: block; }
    .modal-btn-primary { background: var(--primary); color: #fff; }
    .modal-btn-primary:hover { background: var(--primary-hover); }
    .modal-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .log-manual {
      font-size: 0.675rem; font-weight: 600; color: #92400e; background: #fef3c7;
      padding: 2px 8px; border-radius: 9999px; flex-shrink: 0;
    }

    .punch-btn-icon {
      width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .punch-btn-label { font-size: 1.125rem; }

    .btn-clockin { background: var(--success); }
    .btn-clockin:hover:not(:disabled) { background: var(--success-hover); }
    .btn-goout { background: var(--warning); }
    .btn-goout:hover:not(:disabled) { background: var(--warning-hover); }
    .btn-goreturn { background: var(--info); }
    .btn-goreturn:hover:not(:disabled) { background: var(--info-hover); }
    .btn-clockout { background: var(--danger); }
    .btn-clockout:hover:not(:disabled) { background: #b91c1c; }

    @media (max-width: 600px) {
      .punch-buttons { grid-template-columns: 1fr; max-width: 320px; }
    }

    /* ── Message overlay ── */
    .msg-overlay {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; z-index: 200; pointer-events: none;
    }
    .msg-bubble {
      padding: 28px 48px; border-radius: 24px; font-size: 1.5rem; font-weight: 800;
      color: #fff; opacity: 0; transform: scale(0.5);
      animation: msgPop 2.5s ease-out forwards; text-align: center; line-height: 1.5;
      box-shadow: 0 12px 48px rgba(0,0,0,0.3);
    }
    .msg-clockin { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .msg-clockout { background: linear-gradient(135deg, #2563eb, #3b82f6); }

    @keyframes msgPop {
      0%   { opacity: 0; transform: scale(0.5); }
      15%  { opacity: 1; transform: scale(1.05); }
      25%  { transform: scale(1); }
      80%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95) translateY(-20px); }
    }

    /* ── Today log ── */
    .today-log {
      margin-top: 32px; max-width: 672px; margin-left: auto; margin-right: auto; width: 100%;
    }
    .today-log-title {
      font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .today-log-list {
      list-style: none; background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
    }
    .today-log-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem;
    }
    .today-log-item:last-child { border-bottom: none; }

    .log-type {
      font-weight: 600; padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem;
      flex-shrink: 0;
    }
    .log-type-clockin { background: #dcfce7; color: #16a34a; }
    .log-type-goout { background: #fff7ed; color: #ea580c; }
    .log-type-goreturn { background: #e0f2fe; color: #0284c7; }
    .log-type-clockout { background: #fee2e2; color: #dc2626; }
    .log-type-cancel { background: #f1f5f9; color: #94a3b8; }

    .log-time { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--text); }
    .log-cancelled .log-time { text-decoration: line-through; color: #94a3b8; }
    .log-cancelled .log-type { opacity: 0.5; text-decoration: line-through; }
    .log-reason { font-size: 0.7rem; color: #94a3b8; flex: 1; text-align: right; }
    .log-pending {
      font-size: 0.675rem; font-weight: 600; color: #b45309; background: #fef3c7;
      padding: 2px 8px; border-radius: 9999px; flex-shrink: 0;
    }
    .status-pending { background: #fef3c7; color: #b45309; }

    .btn-cancel-punch {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 8px; font-size: 0.675rem; color: var(--text-secondary);
      cursor: pointer; transition: all 0.12s; flex-shrink: 0;
    }
    .btn-cancel-punch:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Cancel Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    .modal-box {
      background: var(--surface); border-radius: 16px; padding: 24px;
      width: 90%; max-width: 400px; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .modal-subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }

    .reason-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .reason-option {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border: 2px solid var(--border); border-radius: 10px; cursor: pointer;
      font-size: 0.875rem; font-weight: 500; transition: border-color 0.15s;
    }
    .reason-option:hover { border-color: var(--primary); }
    .reason-option.selected { border-color: var(--primary); background: #eff6ff; }
    .reason-option input[type="radio"] { accent-color: var(--primary); }

    .reason-input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.875rem; margin-top: 8px; outline: none;
    }
    .reason-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal-btn {
      padding: 8px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.15s;
    }
    .modal-btn-cancel { background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); }
    .modal-btn-cancel:hover { background: #f1f5f9; }
    .modal-btn-confirm { background: var(--danger); color: #fff; }
    .modal-btn-confirm:hover { background: #b91c1c; }
    .modal-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── History Screen ── */
    .history-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .history-filter { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
    .history-filter select {
      padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.8rem; background: var(--surface); cursor: pointer;
    }

    .history-table {
      width: 100%; border-collapse: collapse; font-size: 0.8rem;
      background: var(--surface); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .history-table th {
      background: #f8fafc; padding: 10px 12px; text-align: left;
      font-weight: 600; color: var(--text-secondary); font-size: 0.725rem;
      border-bottom: 2px solid var(--border);
    }
    .history-table td {
      padding: 8px 12px; border-bottom: 1px solid #f1f5f9;
    }
    .history-table tr:hover td { background: #fafbfc; }

    .history-cancelled td { color: #94a3b8; }
    .history-cancelled .log-time { text-decoration: line-through; }

    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a; color: #fff; padding: 14px 28px; border-radius: 14px;
      font-size: 1rem; font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      opacity: 0; transition: transform 0.3s ease-out, opacity 0.3s ease-out;
      z-index: 100; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .empty-state {
      text-align: center; padding: 40px 16px; color: var(--text-secondary); font-size: 0.875rem;
    }

    .app-footer { margin-top: auto; padding-top: 16px; text-align: right; }
    .app-version {
      background: none; border: none; cursor: pointer;
      font: inherit; font-size: 0.95rem; font-weight: 600;
      color: var(--text-secondary); font-variant-numeric: tabular-nums;
      padding: 6px 10px; border-radius: 8px; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .app-version:hover { color: var(--primary); background: #eff6ff; }
    .app-version::before { content: '📋'; font-size: 0.9rem; }
    .setup-version {
      text-align: center; font-size: 0.8rem; color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* ── バージョン履歴モーダル ── */
    .changelog-box { max-height: 80vh; overflow-y: auto; max-width: 480px; }
    .changelog-list { display: flex; flex-direction: column; gap: 20px; margin: 8px 0 4px; }
    .changelog-entry { border-left: 3px solid var(--border); padding-left: 14px; }
    .changelog-entry:first-child { border-left-color: var(--primary); }
    .changelog-ver { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .changelog-ver .ver { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    .changelog-ver .date { font-size: 0.75rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .changelog-changes { list-style: disc; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
    .changelog-changes li { font-size: 0.875rem; color: var(--text); line-height: 1.6; }

    /* 端末登録画面 */
    .setup-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .setup-overlay.show { display: flex; }
    .setup-card {
      width: 100%; max-width: 440px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 32px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .setup-title { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .setup-desc { font-size: 0.95rem; line-height: 1.8; color: var(--text-secondary); }
    .setup-field { display: flex; flex-direction: column; gap: 8px; }
    .setup-label { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
    .setup-input {
      font: inherit; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--bg); color: var(--text);
    }
    .setup-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .setup-error {
      font-size: 0.9rem; color: #b91c1c; background: #fee2e2;
      border: 1px solid #fecaca; border-radius: 10px; padding: 12px 14px; display: none;
    }
    .setup-error.show { display: block; }
    .setup-btn {
      margin-top: 4px; padding: 16px; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer;
    }
    .setup-btn:hover { background: var(--primary-hover); }
    .setup-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
  </head>
  <body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <div>
          <div class="header-title">打刻</div>
          <div class="header-date" id="headerDate"></div>
        </div>
        <button class="btn-history" id="btnShowHistory">履歴</button>
      </div>
      <div class="header-clock" id="headerClock"></div>
    </div>

    <div class="screen active" id="screenList">
      <div class="employee-grid" id="employeeGrid"></div>
    </div>

    <div class="screen" id="screenPunch">
      <div class="punch-header">
        <button class="btn-back" id="btnBack">← 戻る</button>
        <div>
          <div class="punch-employee-name" id="punchName"></div>
          <div class="punch-employee-dept" id="punchDept"></div>
        </div>
      </div>
      <div class="punch-buttons">
        <button class="punch-btn btn-clockin" id="btnClockIn">
          <span class="punch-btn-icon">▶</span>
          <span class="punch-btn-label">出勤</span>
        </button>
        <button class="punch-btn btn-goout" id="btnGoOut">
          <span class="punch-btn-icon">↗</span>
          <span class="punch-btn-label">外出</span>
        </button>
        <button class="punch-btn btn-goreturn" id="btnGoReturn">
          <span class="punch-btn-icon">↩</span>
          <span class="punch-btn-label">戻り</span>
        </button>
        <button class="punch-btn btn-clockout" id="btnClockOut">
          <span class="punch-btn-icon">■</span>
          <span class="punch-btn-label">退勤</span>
        </button>
      </div>
      <div class="punch-hint">ボタンを2秒以上長押しすると、時刻を指定した手動打刻ができます</div>
      <div class="today-log">
        <div class="today-log-title">本日の打刻履歴</div>
        <ul class="today-log-list" id="todayLog"></ul>
      </div>
    </div>

    <div class="screen" id="screenHistory">
      <div class="history-header">
        <button class="btn-back" id="btnHistoryBack">← 戻る</button>
        <div class="history-filter">
          <select id="historyEmployee">
            <option value="">全従業員</option>
          </select>
          <select id="historyDate"></select>
        </div>
      </div>
      <table class="history-table" id="historyTable">
        <thead>
          <tr>
            <th>日付</th>
            <th>従業員</th>
            <th>種別</th>
            <th>時刻</th>
            <th>状態</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <footer class="app-footer">
      <button class="app-version" id="appVersion" type="button" title="バージョン履歴を表示">v__APP_VERSION__</button>
    </footer>
  </div>

  <div class="modal-overlay" id="changelogOverlay" style="display:none">
    <div class="modal-box changelog-box">
      <div class="modal-title">バージョン履歴</div>
      <div class="changelog-list" id="changelogList"></div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="changelogClose">閉じる</button>
      </div>
    </div>
  </div>

  <div class="setup-overlay" id="setupOverlay">
    <div class="setup-card">
      <div class="setup-title">端末の登録</div>
      <div class="setup-desc">この端末で打刻を行うには、管理者による登録が必要です。管理パスワードを入力してください。登録は最初の一度だけです。</div>
      <div class="setup-field">
        <label class="setup-label" for="setupLabel">端末名（任意）</label>
        <input class="setup-input" id="setupLabel" type="text" placeholder="例：事務所iPad" autocomplete="off" />
      </div>
      <div class="setup-field">
        <label class="setup-label" for="setupPassword">管理パスワード</label>
        <input class="setup-input" id="setupPassword" type="password" placeholder="管理パスワード" autocomplete="off" />
      </div>
      <div class="setup-error" id="setupError"></div>
      <button class="setup-btn" id="setupBtn">この端末を登録する</button>
      <div class="setup-version">らくらく給与明細α 打刻 v__APP_VERSION__</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE_URL = '';

    // ── デモモード ──
    // URL に ?demo=1 を付けたときだけ有効。バックエンド（/api）無しで動作確認するための
    // ローカル専用モード。端末登録をスキップし、サンプルの1ヶ月分打刻を表示する。
    const IS_DEMO = new URLSearchParams(location.search).has('demo');

    // ── 端末登録（デバイストークン）──
    const DEVICE_TOKEN_KEY = 'punch_device_token';
    function getDeviceToken() {
      try { return localStorage.getItem(DEVICE_TOKEN_KEY); } catch (e) { return null; }
    }
    function setDeviceToken(token) {
      try { localStorage.setItem(DEVICE_TOKEN_KEY, token); } catch (e) {}
    }
    function clearDeviceToken() {
      try { localStorage.removeItem(DEVICE_TOKEN_KEY); } catch (e) {}
    }
    function showDeviceSetup() {
      const el = document.getElementById('setupOverlay');
      if (el) el.classList.add('show');
    }
    function hideDeviceSetup() {
      const el = document.getElementById('setupOverlay');
      if (el) el.classList.remove('show');
    }
    async function registerDevice(password, label) {
      const res = await fetch(`${API_BASE_URL}/api/devices/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, label }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.token) {
        throw new Error(body.error ?? `登録に失敗しました (${res.status})`);
      }
      setDeviceToken(body.token);
    }

    const DEFAULT_EMPLOYEES = [
      { id: 1, name: '藤原 誠一', dept: '総務部', type: '役員', color: '#3b82f6' },
      { id: 2, name: '中村 健太', dept: '営業部', type: '社員', color: '#ef4444' },
      { id: 3, name: '山本 裕子', dept: '総務部', type: '役員', color: '#10b981' },
      { id: 4, name: '高橋 大輔', dept: '技術部', type: '社員', color: '#f59e0b' },
      { id: 5, name: '佐藤 俊介', dept: '営業部', type: '社員', color: '#8b5cf6' },
      { id: 6, name: '伊藤 翔太', dept: '製造部', type: 'パート', color: '#ec4899' },
      { id: 7, name: '渡辺 美咲', dept: '製造部', type: 'パート', color: '#06b6d4' },
      { id: 8, name: '松田 浩二', dept: '倉庫部', type: 'パート', color: '#f97316' },
    ];

    // 本番では前回取得した名簿を端末に残し、起動直後に通信できなくても実在の名簿で表示する。
    // （以前はサンプル名簿で描画していたため、通信断の直後にサンプルの人物を押せてしまい、
    //  未送信キューの導入後はその打刻が実在の従業員IDとして送られてしまう恐れがある）
    const EMPLOYEES_CACHE_KEY = 'punch_employees_cache_v1';
    function loadEmployeesCache() {
      try {
        const raw = localStorage.getItem(EMPLOYEES_CACHE_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }
    function saveEmployeesCache(list) {
      try { localStorage.setItem(EMPLOYEES_CACHE_KEY, JSON.stringify(list)); } catch (e) {}
    }

    let EMPLOYEES = IS_DEMO ? [...DEFAULT_EMPLOYEES] : loadEmployeesCache();
    let EMP_MAP = {};

    function rebuildEmployeeMap() {
      EMP_MAP = {};
      EMPLOYEES.forEach(e => EMP_MAP[e.id] = e);
    }

    rebuildEmployeeMap();

    const PUNCH_TYPES = {
      clockin:   { label: '出勤', cssClass: 'log-type-clockin' },
      goout:     { label: '外出', cssClass: 'log-type-goout' },
      goreturn:  { label: '戻り', cssClass: 'log-type-goreturn' },
      clockout:  { label: '退勤', cssClass: 'log-type-clockout' },
    };

    const CANCEL_REASONS = ['入力間違い', '人違い', '誤動作'];

    // { "empId-date": [ { type, time, cancelled, cancelReason, cancelTime } ] }
    let punchRecords = {};
    let selectedEmployee = null;

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // ISO文字列をローカル(端末TZ)の日付キー YYYY-MM-DD に変換する
    function localDateKey(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function timeFromIso(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getRecords(empId, date) {
      const key = `${empId}-${date || todayKey()}`;
      if (!punchRecords[key]) punchRecords[key] = [];
      return punchRecords[key];
    }

    function getAllRecords() {
      const all = [];
      for (const [key, recs] of Object.entries(punchRecords)) {
        const [empId, ...dateParts] = key.split('-');
        const date = dateParts.join('-');
        recs.forEach(r => all.push({ ...r, empId: Number(empId), date }));
      }
      return all.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return b.time.localeCompare(a.time);
      });
    }

    function getActiveRecords(empId) {
      return getRecords(empId).filter(r => !r.cancelled);
    }

    function getStatus(empId) {
      const recs = getActiveRecords(empId);
      if (recs.length === 0) return 'out';
      const last = recs[recs.length - 1].type;
      if (last === 'clockout') return 'done';
      if (last === 'goout') return 'goout';
      return 'in';
    }

    function nowTimeStr() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // ローカル(端末TZ)の当日 00:00〜23:59 を UTC の ISO 文字列(Z付き)で返す。
    // タイムゾーンなしの文字列を送るとサーバ側(UTC)で解釈がずれ、当日の記録が欠落するため。
    function todayRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      return {
        start: start.toISOString(),
        end: end.toISOString(),
      };
    }

    // 履歴閲覧用。ローカル(端末TZ)の「1ヶ月前の00:00」〜「当日の23:59」を ISO(Z付き)で返す。
    function monthRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      start.setMonth(start.getMonth() - 1);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      return {
        start: start.toISOString(),
        end: end.toISOString(),
      };
    }

    function formatApiTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function localTypeToApi(type) {
      if (type === 'clockin') return 'clock_in';
      if (type === 'clockout') return 'clock_out';
      if (type === 'goout') return 'go_out';
      if (type === 'goreturn') return 'go_return';
      return null;
    }

    function apiTypeToLocal(type) {
      if (type === 'clock_in') return 'clockin';
      if (type === 'clock_out') return 'clockout';
      if (type === 'go_out') return 'goout';
      if (type === 'go_return') return 'goreturn';
      return 'clockout';
    }

    async function apiJson(path, options) {
      const token = getDeviceToken();
      const res = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'x-device-token': token } : {}),
          ...(options?.headers ?? {}),
        },
      });
      // 401 でも即トークン破棄はしない。呼び出し側（bootApp）が連続401を確認してから
      // 再登録を促す。リロード直後の一時的な401でログアウトさせないための措置。
      if (res.status === 401) {
        const body = await res.json().catch(() => ({}));
        const err = new Error(body.error ?? 'この端末は打刻を許可されていません');
        err.status = 401;
        throw err;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const err = new Error(body.error ?? `API error: ${res.status}`);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    // ── 未送信打刻キュー ──
    // 打刻は押した瞬間に画面へ反映し、サーバー送信は背後で行う。送信に失敗しても
    // 打刻を捨てず（以前はここで巻き戻して「未出勤」に戻っていた）、端末に保存して
    // 通信が回復するまで再送し続ける。従業員はすでに離れているため、失敗を本人に
    // 知らせても手遅れで、打刻そのものを失わないことが最優先。
    // 送信時は端末で採番した clientId と押した時刻を添え、サーバー側で二重登録を防ぐ。
    const PENDING_QUEUE_KEY = 'punch_pending_queue_v1';
    const PENDING_RETRY_MIN_MS = 3000;
    const PENDING_RETRY_MAX_MS = 60000;
    let pendingQueue = loadPendingQueue();
    let pendingFlushing = false;
    let pendingRetryTimer = null;
    let pendingRetryDelay = PENDING_RETRY_MIN_MS;
    // 直近で送信が完了した時刻。定期再読込が古い一覧で上書きしないための判定に使う。
    let lastSendCompletedAt = 0;

    function loadPendingQueue() {
      try {
        const raw = localStorage.getItem(PENDING_QUEUE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(p => p && typeof p.clientId === 'string') : [];
      } catch (e) {
        return [];
      }
    }

    function savePendingQueue() {
      try { localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(pendingQueue)); } catch (e) {}
    }

    function newClientId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
    }

    function enqueuePending(item) {
      pendingQueue.push(item);
      savePendingQueue();
    }

    function removePending(clientId) {
      const before = pendingQueue.length;
      pendingQueue = pendingQueue.filter(p => p.clientId !== clientId);
      if (pendingQueue.length !== before) savePendingQueue();
    }

    function hasPendingFor(empId) {
      return pendingQueue.some(p => p.employeeId === empId);
    }

    // 現在の punchRecords から clientId で打刻行を探す（再読込で配列が差し替わっても追従する）。
    function findRecByClientId(empId, clientId) {
      for (const [key, recs] of Object.entries(punchRecords)) {
        if (!key.startsWith(`${empId}-`)) continue;
        const rec = recs.find(r => r.clientId === clientId);
        if (rec) return rec;
      }
      return null;
    }

    function pendingToRec(item) {
      return {
        remoteId: null,
        clientId: item.clientId,
        type: apiTypeToLocal(item.punchType),
        time: formatApiTime(item.punchedAt),
        manual: item.device === 'manual',
        cancelled: false,
        cancelReason: '',
        cancelTime: '',
        pending: true,
      };
    }

    // 打刻行を時刻順に並べ直す。手動打刻は過去の時刻を後から足すため、
    // 追加順のままだと最後の行で判定する出勤状態（getStatus）が狂う。
    function sortRecsByTime(recs) {
      recs.sort((a, b) => a.time.localeCompare(b.time));
    }

    // モーダル（取消・手動打刻）が開いているか。開いている間は再描画・再読込・自動リロードを控える。
    function isModalOpen() {
      return !!(document.getElementById('cancelModal') || document.getElementById('manualModal'));
    }

    // サーバーの打刻一覧で punchRecords を組み直し、まだ送れていない打刻を重ねる。
    // サーバー側に同じ clientId が既にあれば（応答だけ落ちたケース）二重に出さない。
    function applyServerPunches(punches) {
      punchRecords = {};
      const serverClientIds = new Set();
      for (const punch of punches) {
        if (punch.client_id) serverClientIds.add(punch.client_id);
        const recDate = localDateKey(punch.punched_at);
        const recs = getRecords(punch.employee_id, recDate);
        recs.push({
          remoteId: punch.id,
          clientId: punch.client_id ?? null,
          type: apiTypeToLocal(punch.punch_type),
          time: formatApiTime(punch.punched_at),
          manual: punch.device === 'manual',
          cancelled: punch.cancelled,
          cancelReason: punch.cancelled ? '取消済' : '',
          cancelTime: '',
        });
      }
      let queueChanged = false;
      for (const item of [...pendingQueue]) {
        if (serverClientIds.has(item.clientId)) {
          // 既にサーバーへ届いていた。キューから外すだけでよい。
          pendingQueue = pendingQueue.filter(p => p.clientId !== item.clientId);
          queueChanged = true;
          continue;
        }
        const recs = getRecords(item.employeeId, localDateKey(item.punchedAt));
        recs.push(pendingToRec(item));
        sortRecsByTime(recs);
      }
      if (queueChanged) savePendingQueue();
    }

    async function sendPendingItem(item) {
      const data = await apiJson('/api/punches', {
        method: 'POST',
        body: JSON.stringify({
          employeeId: item.employeeId,
          employeeName: item.employeeName,
          punchType: item.punchType,
          punchedAt: item.punchedAt,
          clientId: item.clientId,
          device: item.device === 'manual' ? 'manual' : 'ipad',
        }),
      });
      return data.punch ?? null;
    }

    function scheduleNextFlush(delayMs) {
      clearTimeout(pendingRetryTimer);
      if (pendingQueue.length === 0) return;
      pendingRetryTimer = setTimeout(() => flushPendingQueue(), delayMs);
    }

    function refreshViewForEmployee(empId) {
      if (isModalOpen()) return;
      if (selectedEmployee && selectedEmployee.id === empId) {
        updatePunchButtons();
        renderLog();
      } else if (document.getElementById('screenList').classList.contains('active')) {
        renderGrid();
      }
    }

    // キューを先頭から順に送る。1件でも失敗したら中断し、間隔を広げながら再試行する。
    async function flushPendingQueue() {
      if (IS_DEMO || pendingFlushing || pendingQueue.length === 0) return;
      pendingFlushing = true;
      let failed = false;
      try {
        while (pendingQueue.length > 0) {
          const item = pendingQueue[0];
          try {
            const remote = await sendPendingItem(item);
            lastSendCompletedAt = Date.now();
            removePending(item.clientId);
            const rec = findRecByClientId(item.employeeId, item.clientId);
            if (rec) {
              rec.pending = false;
              if (remote) {
                rec.remoteId = remote.id;
                rec.time = formatApiTime(remote.punched_at);
                // 送信中に画面で取り消されていた場合は、サーバー側も取り消しておく
                if (rec.cancelled) {
                  await apiJson('/api/punches/cancel', {
                    method: 'POST',
                    body: JSON.stringify({
                      punchId: remote.id,
                      employeeId: item.employeeId,
                      ...todayRange(),
                    }),
                  }).catch((e) => console.error('[pending] cancel after send failed', e));
                }
              }
            }
            refreshViewForEmployee(item.employeeId);
          } catch (err) {
            console.error('[pending] send failed', err);
            if (err && err.status === 400) {
              // 内容不正はいくら再送しても通らない。捨てて画面からも外す。
              removePending(item.clientId);
              const rec = findRecByClientId(item.employeeId, item.clientId);
              if (rec) {
                const recs = getRecords(item.employeeId, localDateKey(item.punchedAt));
                const idx = recs.indexOf(rec);
                if (idx !== -1) recs.splice(idx, 1);
              }
              showToast(`打刻を登録できませんでした: ${err.message}`);
              refreshViewForEmployee(item.employeeId);
              continue;
            }
            failed = true;
            break;
          }
        }
      } finally {
        pendingFlushing = false;
      }
      if (failed) {
        // 失敗が始まった最初の1回だけ知らせる（再試行のたびに出すと煩い）
        if (pendingRetryDelay === PENDING_RETRY_MIN_MS) {
          showToast(`通信できません。接続が戻り次第、自動で送信します（未送信 ${pendingQueue.length} 件）`);
        }
        scheduleNextFlush(pendingRetryDelay);
        pendingRetryDelay = Math.min(pendingRetryDelay * 2, PENDING_RETRY_MAX_MS);
      } else {
        pendingRetryDelay = PENDING_RETRY_MIN_MS;
      }
    }

    async function fetchCloudData() {
      const { start, end } = todayRange();
      const [empData, punchData] = await Promise.all([
        apiJson('/api/employees'),
        apiJson(`/api/punches?${new URLSearchParams({ start, end }).toString()}`),
      ]);
      return { empData, punchData };
    }

    function applyCloudData({ empData, punchData }) {
      const colors = DEFAULT_EMPLOYEES.map(e => e.color);
      EMPLOYEES = empData.employees.map((emp, idx) => ({
        id: emp.id,
        name: emp.name,
        dept: '',
        type: emp.employee_type,
        color: colors[idx % colors.length],
      }));
      rebuildEmployeeMap();
      saveEmployeesCache(EMPLOYEES);

      applyServerPunches(punchData.punches);
    }

    async function loadCloudData() {
      applyCloudData(await fetchCloudData());
    }

    // ── 定期再読込 ──
    // 以前は起動時に1回読むだけで、以後は端末内の記録だけで表示していた。
    // そのため別の端末（事務所の iPad と別の端末）で打刻した人や、
    // 画面を開きっぱなしにしていた端末では、実際は打刻済みでも「未出勤」のまま残った。
    // 一覧画面にいる間は定期的にサーバーと突き合わせ、画面復帰・通信復帰時も読み直す。
    const REFRESH_INTERVAL_MS = 30000;
    let refreshTimer = null;
    let refreshing = false;

    function canRefreshNow() {
      if (IS_DEMO || !getDeviceToken()) return false;
      if (document.visibilityState !== 'visible') return false;
      if (isModalOpen()) return false;
      // 履歴画面は1ヶ月分を保持しているので、当日分で上書きしない
      if (document.getElementById('screenHistory').classList.contains('active')) return false;
      return true;
    }

    async function refreshCloudData() {
      if (refreshing || !canRefreshNow()) return;
      refreshing = true;
      try {
        const startedAt = Date.now();
        const data = await fetchCloudData();
        // 取得中に打刻の送信が完了していたら、その打刻を含まない古い一覧かもしれないので捨てる
        // （適用すると送信済みの打刻が一瞬消えて「未出勤」に見える）。次回の再読込で反映される。
        if (lastSendCompletedAt > startedAt) return;
        if (!canRefreshNow()) return;
        applyCloudData(data);
        consecutive401 = 0;
        if (selectedEmployee) {
          updatePunchButtons();
          renderLog();
        } else {
          renderGrid();
        }
      } catch (err) {
        // 一時的な通信失敗は無視（次回の定期再読込で回復する）
        console.warn('[refresh] failed', err);
        if (err && err.status === 401) {
          // 端末登録が取り消されていた場合は、起動時と同じ基準で再登録へ誘導する
          consecutive401++;
          if (consecutive401 >= MAX_401_BEFORE_RELOGIN) {
            consecutive401 = 0;
            clearDeviceToken();
            showDeviceSetup();
          }
        } else {
          consecutive401 = 0;
        }
      } finally {
        refreshing = false;
      }
    }

    function startPeriodicRefresh() {
      if (refreshTimer || IS_DEMO) return;
      refreshTimer = setInterval(refreshCloudData, REFRESH_INTERVAL_MS);
    }

    window.addEventListener('online', () => {
      flushPendingQueue();
      refreshCloudData();
    });

    // 履歴画面用: 過去1ヶ月分の打刻を取得して punchRecords を差し替える。
    // 当日分も含むため、グリッドの出退勤ステータス（当日キー参照）も維持される。
    async function loadMonthData() {
      const { start, end } = monthRange();
      const punchData = await apiJson(`/api/punches?${new URLSearchParams({ start, end }).toString()}`);
      applyServerPunches(punchData.punches);
    }

    // デモモード用: 過去1ヶ月分（平日）のサンプル打刻を punchRecords に生成する。
    function seedDemoData() {
      EMPLOYEES = [...DEFAULT_EMPLOYEES];
      rebuildEmployeeMap();
      punchRecords = {};
      const now = new Date();
      for (let i = 0; i < 31; i++) {
        const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        if (day.getDay() === 0 || day.getDay() === 6) continue; // 土日は除外
        const dateKey = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
        EMPLOYEES.forEach((emp, idx) => {
          // 一部の従業員・日はランダムに休みにして変化をつける
          if ((i + idx) % 7 === 3) return;
          const recs = getRecords(emp.id, dateKey);
          const inH = 8, inM = 20 + ((idx * 3 + i) % 20);
          recs.push({ remoteId: `demo-${emp.id}-${i}-in`, type: 'clockin', time: `${String(inH).padStart(2,'0')}:${String(inM).padStart(2,'0')}`, cancelled: false, cancelReason: '', cancelTime: '' });
          // 当日(i===0)は一部だけ退勤済みにして「出勤中」も見せる
          if (i === 0 && idx % 2 === 0) return;
          const outH = 17, outM = 25 + ((idx * 5 + i) % 30);
          recs.push({ remoteId: `demo-${emp.id}-${i}-out`, type: 'clockout', time: `${String(outH).padStart(2,'0')}:${String(outM % 60).padStart(2,'0')}`, cancelled: false, cancelReason: '', cancelTime: '' });
        });
      }
    }

    async function cancelRemotePunch(rec) {
      if (IS_DEMO) return;
      if (!selectedEmployee) return;
      // まだサーバーへ届いていない打刻は、送信キューから外すだけで取消になる
      if (rec.pending || !rec.remoteId) {
        if (rec.clientId) removePending(rec.clientId);
        rec.pending = false;
        return;
      }
      const { start, end } = todayRange();
      await apiJson('/api/punches/cancel', {
        method: 'POST',
        body: JSON.stringify({
          punchId: rec.remoteId,
          employeeId: selectedEmployee.id,
          start,
          end,
        }),
      });
    }

    // ── Clock ──
    let currentDayKey = todayKey();

    // 0時0分をまたいだときの処理。
    // 本番: ページを丸ごとリロードして当日実績をリセットし、PWAの更新も取り込む。
    //   （iPadがスリープしていてもタイマー復帰時 or 画面復帰時に日付変化を検知して発火）
    // デモ: リロードせず当日実績だけリセット（動作確認を妨げないため）。
    async function handleDayChange() {
      if (!IS_DEMO) {
        location.reload();
        return;
      }
      punchRecords = {};
      renderGrid();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('headerClock').textContent =
        `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      const wd = ['日','月','火','水','木','金','土'];
      document.getElementById('headerDate').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${wd[now.getDay()]}）`;

      const key = todayKey();
      if (key !== currentDayKey) {
        currentDayKey = key;
        handleDayChange();
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── 保険の自動リロード / 放置画面の自動復帰 ──
    // 定期再読込や送信キューが何らかの理由で止まっても表示が古いまま残らないよう、
    // 5分おきにページごとリロードする（PWA の更新取り込みも兼ねる）。
    // 誰かが操作中・打刻画面を開いた直後・取消モーダル表示中・送信途中は避け、
    // 条件が整った次の確認タイミングで行う。
    // また、カードを開いたまま放置された打刻画面（出勤ボタンを押さずに離れた場合）は
    // 60秒で一覧へ戻す。開きっぱなしだと次の人が戸惑い、本人も打刻したつもりになりやすい。
    const AUTO_RELOAD_INTERVAL_MS = 5 * 60 * 1000;
    const AUTO_RELOAD_IDLE_MS = 15 * 1000;
    const PUNCH_SCREEN_IDLE_MS = 60 * 1000;
    const pageLoadedAt = Date.now();
    let lastInteractionAt = Date.now();
    document.addEventListener('pointerdown', () => { lastInteractionAt = Date.now(); }, { passive: true, capture: true });
    document.addEventListener('keydown', () => { lastInteractionAt = Date.now(); }, { passive: true, capture: true });

    function isUserIdleFor(ms) {
      return Date.now() - lastInteractionAt >= ms;
    }

    function watchdogTick() {
      if (IS_DEMO) return;
      const punchOpen = document.getElementById('screenPunch').classList.contains('active');
      const modalOpen = isModalOpen();

      // 打刻画面の放置 → 一覧へ戻す
      if (punchOpen && !modalOpen && isUserIdleFor(PUNCH_SCREEN_IDLE_MS)) {
        closePunch();
        return;
      }

      if (Date.now() - pageLoadedAt < AUTO_RELOAD_INTERVAL_MS) return;
      if (document.visibilityState !== 'visible') return;
      if (punchOpen || modalOpen) return;
      if (document.getElementById('screenHistory').classList.contains('active')) return;
      if (!isUserIdleFor(AUTO_RELOAD_IDLE_MS)) return;
      if (pendingFlushing) return; // 未送信キューは端末に保存済みなので、送信途中だけ避ければよい
      location.reload();
    }
    setInterval(watchdogTick, 5000);

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ── Screens ──
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── Employee Grid ──
    function renderGrid() {
      const grid = document.getElementById('employeeGrid');
      grid.innerHTML = '';
      if (EMPLOYEES.length === 0) {
        grid.innerHTML = '<div class="empty-state">従業員一覧を読み込んでいます。表示されない場合は通信状態を確認してください。</div>';
        return;
      }
      EMPLOYEES.forEach(emp => {
        const status = getStatus(emp.id);
        const pending = hasPendingFor(emp.id);
        const baseLabel = status === 'in' ? '出勤中' : status === 'goout' ? '外出中' : status === 'done' ? '退勤済' : '未出勤';
        const statusLabel = pending ? `${baseLabel}（送信待ち）` : baseLabel;
        const statusClass = pending ? 'status-pending' : status === 'in' ? 'status-in' : status === 'goout' ? 'status-goout' : status === 'done' ? 'status-done' : 'status-out';
        const card = document.createElement('div');
        card.className = 'employee-card';
        card.innerHTML = `
          <div class="employee-avatar" style="background:${emp.color}">${emp.name[0]}</div>
          <div class="employee-name">${emp.name}</div>
          <div class="employee-dept">${emp.dept}</div>
          <span class="employee-status ${statusClass}">${statusLabel}</span>
        `;
        card.onclick = () => openPunch(emp);
        grid.appendChild(card);
      });
    }

    // ── Punch ──
    function openPunch(emp) {
      selectedEmployee = emp;
      // 打刻ボタン押下前（従業員選択のジェスチャー時）にオーディオを起こしておく。
      // これにより doPunch 時点で AudioContext が running となり、効果音が確実に鳴る。
      primePunchSound();
      document.getElementById('punchName').textContent = emp.name;
      document.getElementById('punchDept').textContent = `${emp.dept}`;
      showScreen('screenPunch');
      updatePunchButtons();
      renderLog();
    }

    function closePunch() {
      clearTimeout(autoReturnTimer);
      selectedEmployee = null;
      showScreen('screenList');
      renderGrid();
      // 一覧に戻るタイミングでサーバーと突き合わせる（打刻後に最新状態で一覧へ戻す）
      refreshCloudData();
    }

    function updatePunchButtons() {
      if (!selectedEmployee) return;
      const status = getStatus(selectedEmployee.id);
      const active = getActiveRecords(selectedEmployee.id);
      const hasClockedIn = active.some(r => r.type === 'clockin');
      document.getElementById('btnClockIn').disabled = hasClockedIn;
      document.getElementById('btnGoOut').disabled = status !== 'in';
      document.getElementById('btnGoReturn').disabled = status !== 'goout';
      document.getElementById('btnClockOut').disabled = status !== 'in' && status !== 'goout';
    }

    let autoReturnTimer = null;
    let punchAudioContext = null;

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      // iPad がスリープ/バックグラウンドから復帰すると context が closed になることが
      // あるため、その場合は作り直す。
      if (!punchAudioContext || punchAudioContext.state === 'closed') {
        punchAudioContext = new AudioContextClass();
      }
      return punchAudioContext;
    }

    // iOS/Safari 対策: AudioContext を解錠する。resume() だけでは復帰しないため、
    // 無音バッファも再生して確実に起こす。iPad がスリープ/バックグラウンド化すると
    // 再び suspended/closed に戻るため、1度きりにせず毎回のユーザー操作で呼び直して
    // 常に生かしておく（これを怠ると「一度は鳴るが、しばらくすると無音」になる）。
    function ensureAudioReady() {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      try {
        const source = ctx.createBufferSource();
        source.buffer = ctx.createBuffer(1, 1, 22050);
        source.connect(ctx.destination);
        source.start(0);
      } catch { /* 解錠失敗は無視（後続の resume で再試行される） */ }
    }

    // 従業員選択・打刻の各ジェスチャー時に呼ぶ解錠処理（別名）
    function primePunchSound() {
      ensureAudioReady();
    }

    function playPunchSound(type) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const play = () => {
        const now = ctx.currentTime;
        const baseFreq = {
          clockin: 920,
          goout: 760,
          goreturn: 840,
          clockout: 700,
        }[type] ?? 780;

        const playTone = (freq, start, duration, peak, wave = 'triangle') => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, start);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.08, start + duration * 0.4);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(peak, start + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + duration + 0.02);
        };

        playTone(baseFreq, now, 0.18, 0.14);
        playTone(baseFreq * 1.5, now + 0.08, 0.22, 0.12);
        playTone(baseFreq * 2, now + 0.15, 0.16, 0.07, 'sine');
      };

      if (ctx.state === 'suspended') {
        ctx.resume().then(play).catch(() => {});
        return;
      }

      play();
    }

    function showMessage(type) {
      const messages = { clockin: '本日もよろしくお願いします', clockout: 'お疲れさまでした' };
      const msg = messages[type];
      if (!msg) return;
      const overlay = document.createElement('div');
      overlay.className = 'msg-overlay';
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble msg-${type}`;
      bubble.textContent = msg;
      overlay.appendChild(bubble);
      document.body.appendChild(overlay);
      setTimeout(() => overlay.remove(), 2600);
    }

    // options.manual=true のときは options.punchedAt(Date) を打刻時刻にした「手動打刻」として記録する。
    function doPunch(type, options = {}) {
      if (!selectedEmployee) return;
      const emp = selectedEmployee;
      primePunchSound();
      const manual = options.manual === true;

      // 押した瞬間にUIへ反映し、同時に端末へ保存（未送信キュー）してから背後で送信する。
      // 送信に失敗しても打刻は消さず、通信回復後に押した時刻のまま再送する。
      const punchedAt = manual && options.punchedAt instanceof Date ? options.punchedAt : new Date();
      const item = {
        clientId: newClientId(),
        employeeId: emp.id,
        employeeName: emp.name,
        punchType: localTypeToApi(type),
        punchedAt: punchedAt.toISOString(),
        device: manual ? 'manual' : 'ipad',
      };
      const recs = getRecords(emp.id, localDateKey(item.punchedAt));
      const optimisticRec = pendingToRec(item);
      recs.push(optimisticRec);
      // 手動打刻は過去時刻のことが多いので時刻順に並べ直す（出勤状態の判定を正しく保つ）
      if (manual) sortRecsByTime(recs);
      if (!IS_DEMO) enqueuePending(item);

      showToast(manual
        ? `${PUNCH_TYPES[type].label} ${optimisticRec.time}（※手動打刻）`
        : `${PUNCH_TYPES[type].label} ${optimisticRec.time}`);
      if (!manual) showMessage(type);
      playPunchSound(type);
      if (selectedEmployee?.id === emp.id) {
        updatePunchButtons();
        renderLog();
      }
      clearTimeout(autoReturnTimer);
      autoReturnTimer = setTimeout(() => closePunch(), 3000);

      if (IS_DEMO) {
        optimisticRec.pending = false;
        optimisticRec.remoteId = `demo-${Date.now()}`;
        return;
      }

      // 背後でサーバへ送信。失敗時は flushPendingQueue が間隔を空けて再送する。
      flushPendingQueue();
    }

    // ── 手動打刻（長押し） ──
    // 打刻ボタンを2秒以上長押しすると、時刻を指定して打刻できる。
    // 押し忘れを後から補うための機能で、記録は device='manual' となり履歴に「※手動打刻」と出る。
    const LONG_PRESS_MS = 2000;

    function pad2(n) { return String(n).padStart(2, '0'); }

    function showManualPunchModal(type) {
      if (!selectedEmployee || isModalOpen()) return;
      clearTimeout(autoReturnTimer);
      const typeLabel = PUNCH_TYPES[type].label;
      const now = new Date();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'manualModal';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">手動打刻 — ${typeLabel}</div>
          <div class="modal-subtitle">${selectedEmployee.name} さんの「${typeLabel}」を、指定した時刻で記録します（本日分のみ）。</div>
          <input type="time" class="manual-time-input" id="manualTime" step="60" value="${pad2(now.getHours())}:${pad2(now.getMinutes())}" />
          <div class="modal-error" id="manualError"></div>
          <div class="manual-note">※ 手動打刻として記録され、履歴に「※手動打刻」と表示されます。実際にボタンを押した時刻ではありません。</div>
          <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="manualModalClose">キャンセル</button>
            <button class="modal-btn modal-btn-primary" id="manualModalConfirm">この時刻で${typeLabel}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = overlay.querySelector('#manualTime');
      const errEl = overlay.querySelector('#manualError');
      const close = () => overlay.remove();
      overlay.querySelector('#manualModalClose').onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };

      overlay.querySelector('#manualModalConfirm').onclick = () => {
        errEl.classList.remove('show');
        const m = /^(\d{2}):(\d{2})$/.exec(input.value || '');
        if (!m) {
          errEl.textContent = '時刻を入力してください';
          errEl.classList.add('show');
          return;
        }
        const t = new Date();
        t.setHours(Number(m[1]), Number(m[2]), 0, 0);
        if (t.getTime() > Date.now()) {
          errEl.textContent = '現在時刻より後の時刻は指定できません';
          errEl.classList.add('show');
          return;
        }
        close();
        doPunch(type, { manual: true, punchedAt: t });
      };
    }

    // ボタンに長押し検出を付ける。2秒満了で手動打刻モーダルを開き、その後の click は無視する。
    // 途中で指を離す／外れる／スクロールした場合は通常のタップ（click）として扱う。
    function attachLongPress(btn, type) {
      let timer = null;
      let fired = false;

      const cancel = () => {
        clearTimeout(timer);
        timer = null;
        btn.classList.remove('pressing');
      };

      btn.addEventListener('pointerdown', (e) => {
        if (btn.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
        fired = false;
        btn.classList.add('pressing');
        timer = setTimeout(() => {
          timer = null;
          fired = true;
          btn.classList.remove('pressing');
          showManualPunchModal(type);
        }, LONG_PRESS_MS);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, cancel));
      btn.addEventListener('contextmenu', (e) => e.preventDefault());

      btn.addEventListener('click', () => {
        if (fired) { fired = false; return; }
        cancel();
        doPunch(type);
      });
    }

    // ── Cancel Modal ──
    let cancelTarget = null;

    function showCancelModal(recIndex) {
      cancelTarget = recIndex;
      clearTimeout(autoReturnTimer);
      const rec = getRecords(selectedEmployee.id)[recIndex];
      const typeLabel = PUNCH_TYPES[rec.type]?.label ?? rec.type;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'cancelModal';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">打刻取消</div>
          <div class="modal-subtitle">${typeLabel} ${rec.time} を取り消します。理由を選択してください。</div>
          <div class="reason-options" id="reasonOptions">
            ${CANCEL_REASONS.map((r, i) => `
              <label class="reason-option" data-idx="${i}">
                <input type="radio" name="reason" value="${r}" />
                ${r}
              </label>
            `).join('')}
            <label class="reason-option" data-idx="other">
              <input type="radio" name="reason" value="__other__" />
              その他
            </label>
          </div>
          <input type="text" class="reason-input" id="reasonCustom" placeholder="理由を入力..." style="display:none" />
          <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="cancelModalClose">キャンセル</button>
            <button class="modal-btn modal-btn-confirm" id="cancelModalConfirm" disabled>取り消す</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      let selectedReason = '';
      const options = overlay.querySelectorAll('.reason-option');
      const customInput = overlay.querySelector('#reasonCustom');
      const confirmBtn = overlay.querySelector('#cancelModalConfirm');

      options.forEach(opt => {
        opt.onclick = () => {
          options.forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
          const val = opt.querySelector('input').value;
          if (val === '__other__') {
            customInput.style.display = 'block';
            customInput.focus();
            selectedReason = customInput.value.trim();
            confirmBtn.disabled = !selectedReason;
          } else {
            customInput.style.display = 'none';
            selectedReason = val;
            confirmBtn.disabled = false;
          }
        };
      });

      customInput.oninput = () => {
        selectedReason = customInput.value.trim();
        confirmBtn.disabled = !selectedReason;
      };

      overlay.querySelector('#cancelModalClose').onclick = () => overlay.remove();
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      confirmBtn.onclick = async () => {
        const recs = getRecords(selectedEmployee.id);
        const rec = recs[cancelTarget];
        try {
          await cancelRemotePunch(rec);
          rec.cancelled = true;
          rec.cancelReason = selectedReason;
          rec.cancelTime = nowTimeStr();
          overlay.remove();
          showToast(`${typeLabel}を取り消しました`);
          updatePunchButtons();
          renderLog();
        } catch (err) {
          showToast(`取消に失敗しました: ${err instanceof Error ? err.message : '不明なエラー'}`);
        }
      };
    }

    // ── Log ──
    function renderLog() {
      if (!selectedEmployee) return;
      const recs = getRecords(selectedEmployee.id);
      const list = document.getElementById('todayLog');
      if (recs.length === 0) {
        list.innerHTML = '<li class="today-log-item"><span class="empty-state">打刻履歴はありません</span></li>';
        return;
      }
      list.innerHTML = recs.map((r, i) => {
        const cls = r.cancelled ? 'today-log-item log-cancelled' : 'today-log-item';
        const typeClass = r.cancelled ? 'log-type log-type-cancel' : `log-type ${PUNCH_TYPES[r.type].cssClass}`;
        const cancelBtn = !r.cancelled
          ? `<button class="btn-cancel-punch" data-idx="${i}">取消</button>`
          : `<span class="log-reason">取消: ${r.cancelReason}</span>`;
        const pendingMark = r.pending && !r.cancelled ? '<span class="log-pending">送信待ち</span>' : '';
        const manualMark = r.manual ? '<span class="log-manual">※手動打刻</span>' : '';
        return `<li class="${cls}">
          <span class="${typeClass}">${PUNCH_TYPES[r.type].label}</span>
          <span class="log-time">${r.time}</span>
          ${manualMark}
          ${pendingMark}
          ${cancelBtn}
        </li>`;
      }).join('');

      list.querySelectorAll('.btn-cancel-punch').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          showCancelModal(Number(btn.dataset.idx));
        };
      });
    }

    // ── History Screen ──
    async function openHistory() {
      showScreen('screenHistory');
      const body = document.getElementById('historyBody');
      body.innerHTML = '<tr><td colspan="5" class="empty-state">読み込み中...</td></tr>';

      // 過去1ヶ月分を読み込む（デモモードは既に seed 済みなので取得不要）
      if (!IS_DEMO) {
        try {
          await loadMonthData();
        } catch (err) {
          console.error(err);
          body.innerHTML = `<tr><td colspan="5" class="empty-state">履歴の取得に失敗しました（${err && err.message ? err.message : '不明なエラー'}）</td></tr>`;
          return;
        }
      }

      const empSelect = document.getElementById('historyEmployee');
      empSelect.innerHTML = '<option value="">全従業員</option>' +
        EMPLOYEES.map(e => `<option value="${e.id}">${e.name}</option>`).join('');

      const dateSelect = document.getElementById('historyDate');
      const dates = new Set();
      for (const key of Object.keys(punchRecords)) {
        const parts = key.split('-');
        dates.add(parts.slice(1).join('-'));
      }
      const sorted = [...dates].sort().reverse();
      // 「全期間（直近1ヶ月）」を先頭に、その後に日付ごとの選択肢
      dateSelect.innerHTML = '<option value="">全期間（直近1ヶ月）</option>' +
        sorted.map(d => `<option value="${d}">${d}</option>`).join('');

      renderHistory();
    }

    function renderHistory() {
      const empFilter = document.getElementById('historyEmployee').value;
      const dateFilter = document.getElementById('historyDate').value;
      const body = document.getElementById('historyBody');

      const all = getAllRecords().filter(r => {
        if (empFilter && r.empId !== Number(empFilter)) return false;
        if (dateFilter && r.date !== dateFilter) return false;
        return true;
      });

      if (all.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state">履歴はありません</td></tr>';
        return;
      }

      const wd = ['日','月','火','水','木','金','土'];
      const fmtDate = (iso) => {
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return `${Number(parts[1])}/${Number(parts[2])}（${wd[d.getDay()]}）`;
      };

      body.innerHTML = all.map(r => {
        const emp = EMP_MAP[r.empId];
        const rowClass = r.cancelled ? 'history-cancelled' : '';
        const status = r.cancelled ? `<span class="log-type log-type-cancel">取消済</span>` : '<span style="color:#16a34a;font-weight:600;font-size:0.75rem">有効</span>';
        const notes = [];
        if (r.manual) notes.push('※手動打刻');
        if (r.cancelled) notes.push(`${r.cancelReason}${r.cancelTime ? `（${r.cancelTime}）` : ''}`);
        const note = notes.join(' / ');
        return `<tr class="${rowClass}">
          <td style="white-space:nowrap">${fmtDate(r.date)}</td>
          <td>${emp?.name ?? '---'}</td>
          <td><span class="log-type ${PUNCH_TYPES[r.type].cssClass}">${PUNCH_TYPES[r.type].label}</span>${r.manual ? ' <span class="log-manual">手動</span>' : ''}</td>
          <td class="log-time">${r.time}</td>
          <td>${status}</td>
          <td style="font-size:0.75rem;color:#64748b">${note}</td>
        </tr>`;
      }).join('');
    }

    // ── Events ──
    document.getElementById('btnBack').onclick = closePunch;
    // タップ=今の時刻で打刻、2秒以上の長押し=時刻を指定した手動打刻
    attachLongPress(document.getElementById('btnClockIn'), 'clockin');
    attachLongPress(document.getElementById('btnGoOut'), 'goout');
    attachLongPress(document.getElementById('btnGoReturn'), 'goreturn');
    attachLongPress(document.getElementById('btnClockOut'), 'clockout');
    document.getElementById('btnShowHistory').onclick = openHistory;
    document.getElementById('btnHistoryBack').onclick = () => { showScreen('screenList'); renderGrid(); };
    document.getElementById('historyEmployee').onchange = renderHistory;
    document.getElementById('historyDate').onchange = renderHistory;

    // ── バージョン履歴 ──
    // 新しいバージョンを出したら先頭に追記する（version は package.json と揃える）。
    const CHANGELOG = [
      {
        version: '0.1.5',
        date: '2026-11-05',
        changes: [
          '打刻画面の4つのボタンを2秒以上長押しすると、時刻を指定した手動打刻ができるようにした（押し忘れの補完用・本日分のみ）',
          '手動打刻は本日の打刻履歴・履歴画面に「※手動打刻」と表示',
        ],
      },
      {
        version: '0.1.4',
        date: '2026-11-05',
        changes: [
          '通信に失敗した打刻を端末に保存し、接続が戻り次第「押した時刻のまま」自動で送信するようにした（以前は失敗すると打刻が消えて「未出勤」に戻っていた）',
          '送信できていない打刻は「送信待ち」と表示',
          '一覧を30秒ごと・画面復帰時・一覧に戻った時に自動で読み直し、別の端末で打刻した人も反映されるようにした',
          '保険として、操作が無いときに5分おきに画面を自動リロード',
          'カードを開いたまま放置された打刻画面は60秒で一覧へ戻す',
          '起動直後に通信できないときはサンプルの名簿ではなく前回の名簿を表示',
        ],
      },
      {
        version: '0.1.3',
        date: '2026-10-02',
        changes: [
          '出勤・退勤の一覧を端末に保存しないようにした（通信復帰時に古い「未出勤」が出るのを防ぐ）',
        ],
      },
      {
        version: '0.1.2',
        date: '2026-07-27',
        changes: [
          'アプリ画面にバージョン番号を表示（タップで履歴を確認できます）',
          '退勤したのに「未出勤」と表示される時間帯ズレの不具合を修正',
        ],
      },
      {
        version: '0.1.1',
        date: '2026-07-24',
        changes: [
          '端末登録（管理パスワードによるデバイス認証）に対応',
          '打刻履歴を過去1ヶ月分まで閲覧できるように拡張',
          '日付が変わると自動でリロードし、当日実績をリセット',
          '打刻履歴を新しい順（日付・時刻）に並べ替え',
          'リロード直後の一時的な通信エラーで登録画面に戻らないよう改善',
        ],
      },
      {
        version: '0.1.0',
        date: '2026-07-01',
        changes: [
          'iPad向け打刻アプリ（PWA）を公開',
          '出勤・退勤・外出・戻りの打刻に対応',
          '打刻時の効果音とメッセージ表示を追加',
          'クラウド連携による打刻データの保存',
          '押した瞬間に画面へ反映する仕組みで体感速度を改善',
        ],
      },
    ];

    function renderChangelog() {
      document.getElementById('changelogList').innerHTML = CHANGELOG.map(entry => `
        <div class="changelog-entry">
          <div class="changelog-ver">
            <span class="ver">v${entry.version}</span>
            <span class="date">${entry.date}</span>
          </div>
          <ul class="changelog-changes">
            ${entry.changes.map(c => `<li>${c}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    function openChangelog() {
      renderChangelog();
      document.getElementById('changelogOverlay').style.display = 'flex';
    }
    function closeChangelog() {
      document.getElementById('changelogOverlay').style.display = 'none';
    }

    document.getElementById('appVersion').onclick = openChangelog;
    document.getElementById('changelogClose').onclick = closeChangelog;
    document.getElementById('changelogOverlay').onclick = (e) => {
      if (e.target === document.getElementById('changelogOverlay')) closeChangelog();
    };

    // すべてのユーザー操作でオーディオを解錠し続ける。1度きりにすると iPad が
    // スリープ/バックグラウンドから復帰した後に suspended のまま無音化するため。
    document.addEventListener('pointerdown', ensureAudioReady, { passive: true });
    document.addEventListener('touchstart', ensureAudioReady, { passive: true });
    // バックグラウンド復帰時にも AudioContext を起こし直す。
    // あわせて、スリープ中に日付が変わっていたら 0時リロード処理を発火させる
    // （スリープ中は setInterval が止まるため、復帰時の検知が本命トリガー）。
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      ensureAudioReady();
      if (todayKey() !== currentDayKey) {
        currentDayKey = todayKey();
        handleDayChange();
        return;
      }
      // スリープから戻ったら、未送信の打刻を送り、他端末の打刻も取り込む
      flushPendingQueue();
      refreshCloudData();
    });

    // 起動時のデータ読込。登録済み端末は通信失敗で登録画面に戻さず、その場で再試行する。
    // 401（トークン拒否）が連続で確認できた場合のみ、再登録を促す。
    let bootRetryTimer = null;
    let consecutive401 = 0;
    const MAX_401_BEFORE_RELOGIN = 3;

    async function bootApp() {
      clearTimeout(bootRetryTimer);
      try {
        await loadCloudData();
        consecutive401 = 0;
        renderGrid();
        startPeriodicRefresh();
        // 前回の起動時に送れずに残っていた打刻があれば送る
        flushPendingQueue();
      } catch (err) {
        console.error(err);

        // トークンが無い（初回）なら登録画面
        if (!getDeviceToken()) {
          showDeviceSetup();
          return;
        }

        // 登録済み: 画面は維持したまま再試行する（登録画面には戻さない）
        renderGrid();

        if (err && err.status === 401) {
          consecutive401++;
          if (consecutive401 >= MAX_401_BEFORE_RELOGIN) {
            // 連続で拒否＝トークンが本当に無効。ここで初めて再登録を促す。
            consecutive401 = 0;
            clearDeviceToken();
            showDeviceSetup();
            return;
          }
        } else {
          // ネットワーク/サーバ一時障害は 401 カウントに含めない
          consecutive401 = 0;
        }

        showToast('接続に失敗しました。再試行します...');
        bootRetryTimer = setTimeout(bootApp, 4000);
      }
    }

    // 端末登録ボタン
    (function wireDeviceSetup() {
      const setupBtn = document.getElementById('setupBtn');
      const errEl = document.getElementById('setupError');
      const pwEl = document.getElementById('setupPassword');
      const labelEl = document.getElementById('setupLabel');
      if (!setupBtn) return;

      async function submit() {
        const password = pwEl.value;
        const label = labelEl.value.trim();
        errEl.classList.remove('show');
        if (!password) {
          errEl.textContent = '管理パスワードを入力してください';
          errEl.classList.add('show');
          return;
        }
        setupBtn.disabled = true;
        setupBtn.textContent = '登録中...';
        try {
          await registerDevice(password, label);
          pwEl.value = '';
          hideDeviceSetup();
          await bootApp();
        } catch (err) {
          errEl.textContent = (err && err.message) ? err.message : '登録に失敗しました';
          errEl.classList.add('show');
        } finally {
          setupBtn.disabled = false;
          setupBtn.textContent = 'この端末を登録する';
        }
      }

      setupBtn.onclick = submit;
      pwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    })();

    // 起動: デモモードならサンプル表示、登録済みならデータ読込、未登録なら登録画面
    if (IS_DEMO) {
      seedDemoData();
      renderGrid();
    } else if (getDeviceToken()) {
      bootApp();
    } else {
      showDeviceSetup();
    }
  </script>
  </body>
</html>
